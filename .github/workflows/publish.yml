name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linting
        run: npm run lint
      
      - name: Run type checking
        run: npm run typecheck
      
      - name: Run tests
        run: npm test
      
      - name: Build package
        run: npm run build
      
      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Check for changes since last publish
        id: check_changes
        run: |
          # Get the latest tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tags found, proceeding with publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            # Check if there are changes since the last tag
            CHANGES=$(git diff --name-only $LATEST_TAG..HEAD | grep -E '\.(ts|js|json)$' | grep -v package-lock.json || true)
            
            if [ -n "$CHANGES" ]; then
              echo "Changes detected since $LATEST_TAG:"
              echo "$CHANGES"
              echo "should_publish=true" >> $GITHUB_OUTPUT
            else
              echo "No significant changes since $LATEST_TAG, skipping publish"
              echo "should_publish=false" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Increment version and publish
        if: steps.check_changes.outputs.should_publish == 'true'
        run: |
          # Get current version
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"
          
          # Increment version
          node scripts/increment-version.js
          
          # Get new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          
          # Commit version bump
          git add package.json
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          
          # Create and push tag
          git tag "v$NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"
          
          # Publish to npm
          npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Create GitHub Release
        if: steps.check_changes.outputs.should_publish == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: v${{ env.NEW_VERSION }}
          release_name: Release v${{ env.NEW_VERSION }}
          body: |
            ## Changes
            
            Automated release with version bump to v${{ env.NEW_VERSION }}
            
            ## Installation
            
            ```bash
            npm install file2md@${{ env.NEW_VERSION }}
            ```
          draft: false
          prerelease: false