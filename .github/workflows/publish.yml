name: Publish to npm
on:
  push:
    branches: [main]
concurrency:
  group: npm-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run prepublishOnly
      - name: Check changes
        id: changes
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$latest_tag" ] || ! git diff --quiet "$latest_tag" HEAD -- src scripts package.json package-lock.json tsconfig.build.json; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare version
        if: steps.changes.outputs.publish == 'true'
        id: version
        run: |
          npm run version:increment
          echo "number=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish package
        if: steps.changes.outputs.publish == 'true'
        run: npm publish --access=public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Record published version
        if: steps.changes.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "Bump to $VERSION [skip ci]"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Create release
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.number }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
